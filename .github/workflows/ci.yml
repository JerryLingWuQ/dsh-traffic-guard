name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests (local HTTP server, no internet)
        run: python -m unittest discover -s test -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: plugin syntax
        run: node --check index.mjs
      - name: manifest is valid JSON
        run: python -c "import json; json.load(open('package.json')); json.load(open('cli/config.example.json'))"
